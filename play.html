<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockverse Experiences</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#fff;font:15px Arial,sans-serif}header{height:62px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#1b2435;border-bottom:1px solid #344158}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;font-weight:700;background:#526fff;color:white}#back{background:#303c52}header strong{font-size:19px}#stats{margin-left:auto;color:#d6def1}main{max-width:1000px;margin:20px auto;padding:0 15px}.panel{background:#1b2435;border:1px solid #344158;border-radius:16px;padding:18px;margin-bottom:14px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0 0 6px;font-size:25px}p{color:#b8c4d9;margin:5px 0 14px}canvas{display:block;width:100%;height:auto;max-height:65vh;background:#9bd7f5;border-radius:12px;touch-action:none}.controls{color:#c7d2e7;font-size:13px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{background:#303c52}.actions button.primary{background:#526fff}.mobile{display:none;gap:8px;justify-content:center;margin-top:12px}.mobile button{min-width:58px;font-size:18px}@media(max-width:650px){.mobile{display:flex}header{padding:0 10px}header strong{font-size:15px}#stats{font-size:12px}}
</style></head><body>
<header><button id="back">← Home</button><strong id="brand">BLOCKVERSE</strong><span id="stats">Loading…</span></header>
<main><section class="panel"><div class="toprow"><div><h1 id="title">Loading game</h1><p id="desc">Get ready to play.</p></div><button id="restart">↻ Restart</button></div><canvas id="game" width="960" height="540"></canvas><div class="mobile"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="Space">⤒</button></div><div class="actions" id="actions"></div><p class="controls" id="help">Use your keyboard to play.</p></section></main>
<script>
const params=new URLSearchParams(location.search),name=params.get('game')||'Tower of Jump';
const defs={
'Brookhaven RP':['Town Explorer','Walk around a little town, visit the park and collect the glowing stars.','WASD / arrows to walk. Collect all 8 stars.'],
'Tower of Jump':['Tower of Jump','Jump across platforms, avoid the red hazards and reach the golden flag.','A/D or arrows to move, Space or W to jump.'],
'Pet World':['Pet World','Catch the happy pets as they bounce around. Click or tap a pet to collect it.','Click/tap pets. Catch 12 before the timer runs out.'],
'Mega City Tycoon':['Mega City Tycoon','Build your city by buying plots. Earn coins and unlock bigger buildings.','Click BUY PLOT to expand. Keep earning coins.'],
'Sky Islands':['Sky Islands','Hop across floating islands and collect the gems without falling.','A/D or arrows to move, Space to jump.'],
'Fashion Studio':['Fashion Studio','Style your character! Pick a top, bottoms and accessory, then save your look.','Choose an item in each category.'],
'Speed Run':['Speed Run','Race through the course, jump over obstacles and beat your best time.','A/D or arrows to run, Space to jump.'],
'Cafe Life':['Cafe Life','Serve customers by clicking the matching order before they leave.','Click the matching order button to serve customers.'],
'Block Builder':['Block Builder','Build your own little pixel world. Select a block and click the grid to place it.','Choose a block, then click/tap cells. Right-click to erase.']
};
const key=defs[name]?name:'Tower of Jump',d=defs[key];document.title=d[0];document.getElementById('title').textContent=d[0];document.getElementById('desc').textContent=d[1];document.getElementById('help').textContent=d[2];document.getElementById('back').onclick=()=>location.href='index.html';const c=document.getElementById('game'),ctx=c.getContext('2d');let keys={},state={},last=0,raf=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function text(t,x,y,size=24,color='#17243a'){ctx.fillStyle=color;ctx.font='bold '+size+'px Arial';ctx.fillText(t,x,y)}function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function reset(){state={score:0,time:45,done:false,won:false,player:{x:60,y:430,vx:0,vy:0,on:false},stars:[],pets:[],buildings:0,coins:100,served:0,orders:[],blocks:Array(12*7).fill(0),choice:0,cat:0,skin:0};if(key==='Brookhaven RP'){state.player.x=60;state.stars=Array.from({length:8},(_,i)=>({x:150+i*90,y:330-(i%3)*55,got:false}))}if(['Tower of Jump','Speed Run','Sky Islands'].includes(key)){state.platforms=key==='Sky Islands'?[{x:0,y:490,w:190},{x:240,y:420,w:130},{x:430,y:350,w:130},{x:640,y:285,w:130},{x:830,y:220,w:130}]:[{x:0,y:490,w:960},{x:160,y:410,w:125},{x:350,y:330,w:120},{x:535,y:260,w:125},{x:730,y:190,w:130}];state.hazards=key==='Speed Run'?[{x:280,y:458,w:30,h:32},{x:490,y:458,w:35,h:32},{x:680,y:458,w:35,h:32}]:[{x:300,y:475,w:36,h:15},{x:580,y:475,w:36,h:15}];state.player.y=440}if(key==='Pet World'){state.pets=Array.from({length:10},()=>({x:40+Math.random()*850,y:80+Math.random()*380,r:22+Math.random()*9,got:false,emoji:['🐶','🐱','🐰','🐸','🐼'][Math.floor(Math.random()*5)]}))}if(key==='Cafe Life')newOrders();draw()}
function newOrders(){state.orders=Array.from({length:3},()=>['☕ Coffee','🍰 Cake','🥪 Sandwich'][Math.floor(Math.random()*3)])}
function draw(){ctx.clearRect(0,0,960,540);if(key==='Brookhaven RP')town();else if(['Tower of Jump','Speed Run','Sky Islands'].includes(key))platform();else if(key==='Pet World')pets();else if(key==='Mega City Tycoon')tycoon();else if(key==='Fashion Studio')fashion();else if(key==='Cafe Life')cafe();else builder();document.getElementById('stats').textContent=key==='Mega City Tycoon'?'🪙 '+state.coins+' coins · 🏢 '+state.buildings+' buildings':key==='Cafe Life'?'Served: '+state.served+' · Time: '+Math.ceil(state.time):key==='Pet World'?'Pets: '+state.score+'/12 · '+Math.ceil(state.time)+'s':'Score: '+state.score}
function town(){rect(0,0,960,540,'#9bd7f5');rect(0,360,960,180,'#77c96c');rect(0,405,960,55,'#c8b99b');for(let i=0;i<5;i++){rect(80+i*180,205,115,150,['#f4b27a','#d78b88','#9ca9e7','#e4ca78','#a1c8b7'][i]);rect(95+i*180,225,30,35,'#bce7fa');rect(150+i*180,225,30,35,'#bce7fa');rect(120+i*180,300,35,55,'#805c4d')}circle(state.player.x,state.player.y,17,'#f4c49b');rect(state.player.x-12,state.player.y+15,24,27,'#536cff');state.stars.forEach(s=>{if(!s.got){text('⭐',s.x,s.y,25)}});text('TOWN PARK',390,70,26);text('Collect the stars!',25,45,19)}
function platform(){rect(0,0,960,540,key==='Sky Islands'?'#86d8f4':'#a8dcf7');for(let i=0;i<20;i++)circle((i*137)%960,(i*73)%250,2,'#fff');state.platforms.forEach(p=>{rect(p.x,p.y,p.w,540-p.y,'#68ba61');rect(p.x,p.y,p.w,12,'#398c4b')});state.hazards.forEach(h=>{rect(h.x,h.y,h.w,h.h,'#ef5252')});rect(state.player.x-13,state.player.y-28,26,28,'#526fff');circle(state.player.x,state.player.y-34,12,'#f1c49b');text('🏁',875,175,30);if(state.done){text(state.won?'LEVEL COMPLETE!':'TRY AGAIN!',340,110,34,state.won?'#16824a':'#d33')}}
function pets(){rect(0,0,960,540,'#b8e9d9');for(let i=0;i<10;i++)circle((i*113)%960,((i*67)%400)+60,35,'#ffffff55');state.pets.forEach(p=>{if(!p.got){circle(p.x,p.y,p.r,'#fff');text(p.emoji,p.x-19,p.y+12,32)}});text('PET CATCHER',30,45,25)}
function tycoon(){rect(0,0,960,540,'#9dd9f4');rect(0,350,960,190,'#7bbd69');for(let i=0;i<6;i++){let x=65+i*145;rect(x,310,115,40,'#c8b89c');if(i<state.buildings){rect(x+15,310-(i%3)*40,85,40+(i%3)*40,['#8b9edb','#e8ad72','#8bc9b4'][i%3]);for(let w=0;w<3;w++)rect(x+25+w*25,320-(i%3)*40,12,12,'#e6f5ff')}else{text('EMPTY',x+24,337,14)}}text('YOUR CITY',35,60,28);text('Each building earns 5 coins per second.',35,95,18)}
function fashion(){rect(0,0,960,540,'#f5c9e1');rect(0,390,960,150,'#e9a9cf');circle(480,160,62,'#f1c49b');rect(430,220,100,145,['#ff6b9a','#6b9cff','#7acb9a'][state.skin%3]);rect(438,365,35,80,'#584a80');rect(488,365,35,80,'#584a80');text('YOUR AVATAR',380,60,27);text('TOP: '+['Pink','Blue','Mint'][state.skin%3],400,485,20);text('ACCESSORY: '+['None','Crown','Glasses'][state.cat%3],400,515,17)}
function cafe(){rect(0,0,960,540,'#f5d9b8');rect(0,340,960,200,'#b77d5b');text('☕ CAFE LIFE',30,55,30);text('Customer orders:',40,140,22);state.orders.forEach((o,i)=>{rect(45+i*300,190,260,105,'#fff2df');text(o,65+i*300,250,24,'#543b32')});text('Tap the matching order buttons below.',40,370,19)}
function builder(){rect(0,0,960,540,'#d9e9f7');for(let y=0;y<7;y++)for(let x=0;x<12;x++){let v=state.blocks[y*12+x];rect(x*80+1,y*75+1,78,73,v?['','#67b86b','#9b7653','#8bc7e8','#e7c65e'][v]:'#f5f8fc');ctx.strokeStyle='#c0d0df';ctx.strokeRect(x*80+1,y*75+1,78,73)}text('BLOCK BUILDER',25,35,20)}
function update(dt){if(state.done)return;if(key==='Brookhaven RP'){let p=state.player,s=190*dt;if(keys.ArrowLeft||keys.KeyA)p.x-=s;if(keys.ArrowRight||keys.KeyD)p.x+=s;if(keys.ArrowUp||keys.KeyW)p.y-=s;if(keys.ArrowDown||keys.KeyS)p.y+=s;p.x=Math.max(15,Math.min(945,p.x));p.y=Math.max(130,Math.min(480,p.y));state.stars.forEach(a=>{if(!a.got&&Math.hypot(a.x-p.x,a.y-p.y)<28){a.got=true;state.score++}});if(state.score===8)state.done=true}
if(['Tower of Jump','Speed Run','Sky Islands'].includes(key)){let p=state.player;p.vx=((keys.ArrowRight||keys.KeyD)?230:0)-((keys.ArrowLeft||keys.KeyA)?230:0);if((keys.Space||keys.ArrowUp||keys.KeyW)&&p.on){p.vy=-480;p.on=false}p.vy+=1050*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;state.platforms.forEach(a=>{if(p.vy>=0&&p.x+10>a.x&&p.x-10<a.x+a.w&&p.y>=a.y&&p.y-p.vy*dt<=a.y+8){p.y=a.y;p.vy=0;p.on=true}});if(p.y>560){state.done=true;state.won=false}if(p.x>885&&p.y<230){state.done=true;state.won=true;state.score=1}}
if(key==='Pet World'){state.time-=dt;if(state.time<=0){state.done=true}if(state.score>=12){state.done=true;state.won=true}}
if(key==='Mega City Tycoon'){state.coins+=state.buildings*5*dt}
if(key==='Cafe Life'){state.time-=dt;if(state.time<=0)state.done=true}
}
function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function button(label,fn,primary=true){let b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;document.getElementById('actions').appendChild(b)}
function setupActions(){let a=document.getElementById('actions');a.innerHTML='';if(key==='Mega City Tycoon')button('＋ BUY PLOT (50 coins)',()=>{if(state.coins>=50){state.coins-=50;state.buildings++}else alert('Not enough coins yet!')});if(key==='Fashion Studio'){button('Change Outfit',()=>state.skin++);button('Change Accessory',()=>state.cat++)}if(key==='Cafe Life'){['☕ Coffee','🍰 Cake','🥪 Sandwich'].forEach(o=>button('Serve '+o,()=>{let i=state.orders.indexOf(o);if(i>=0){state.orders.splice(i,1);state.served++;if(!state.orders.length)newOrders()}else alert('That is not on the order!')}))}if(key==='Block Builder'){['Grass','Wood','Water','Gold'].forEach((v,i)=>button(v,()=>state.choice=i+1,i===0))}}
c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;if(key==='Pet World'){let p=state.pets.find(p=>!p.got&&Math.hypot(p.x-x,p.y-y)<p.r+8);if(p){p.got=true;state.score++}}if(key==='Block Builder'){let gx=Math.floor(x/80),gy=Math.floor(y/75);if(gx<12&&gy<7)state.blocks[gy*12+gx]=state.choice} });
c.addEventListener('contextmenu',e=>{e.preventDefault();let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;if(key==='Block Builder')state.blocks[Math.floor(y/75)*12+Math.floor(x/80)]=0});
document.getElementById('restart').onclick=()=>{cancelAnimationFrame(raf);reset();setupActions();last=0;raf=requestAnimationFrame(loop)};
setupActions();reset();raf=requestAnimationFrame(loop);
</script></body></html>
