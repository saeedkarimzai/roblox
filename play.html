<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockverse 3D Experiences</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#fff;font:14px Arial,sans-serif}header{height:58px;display:flex;align-items:center;gap:13px;padding:0 18px;background:#1b2435;border-bottom:1px solid #344158;position:relative;z-index:5}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:700;background:#526fff;color:#fff}#back{background:#303c52}header strong{font-size:18px}#stats{margin-left:auto;color:#d6def1}main{max-width:1200px;margin:14px auto;padding:0 14px}.panel{background:#1b2435;border:1px solid #344158;border-radius:15px;padding:14px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}h1{font-size:22px;margin:0 0 4px}p{margin:0;color:#bac6da}#stage{height:min(68vh,650px);min-height:360px;position:relative;background:#8fd4f6;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#hint{position:absolute;left:12px;bottom:12px;background:#101522c9;padding:9px 12px;border-radius:9px;color:#fff;font-size:12px;pointer-events:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.actions button{background:#34435d}.actions button.primary{background:#526fff}.actions button:active{transform:scale(.97)}.mobile{display:none;gap:6px;justify-content:center;margin-top:10px}.mobile button{min-width:48px;background:#34435d;font-size:18px;touch-action:none}@media(max-width:650px){header{padding:0 8px}header strong{font-size:14px}#stats{font-size:11px}#stage{height:58vh;min-height:330px}.mobile{display:flex}.toprow{align-items:flex-start}h1{font-size:18px}}
</style></head><body>
<header><button id="back">← Home</button><strong>BLOCKVERSE 3D</strong><span id="stats">Loading world…</span></header>
<main><section class="panel"><div class="toprow"><div><h1 id="title">Loading…</h1><p id="desc"></p></div><button id="restart">↻ Restart</button></div><div id="stage"><div id="hint">Click the world to capture mouse · WASD move · Space jump</div></div><div class="mobile"><button data-key="KeyA">◀</button><button data-key="KeyW">▲</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button><button data-key="Space">⤒</button></div><div class="actions" id="actions"></div></section></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const params=new URLSearchParams(location.search),game=params.get('game')||'Tower of Jump';
const descriptions={
'Brookhaven RP':'Explore a colourful 3D neighbourhood, visit houses and collect the floating stars.',
'Tower of Jump':'Climb the tower, jump between platforms and reach the finish platform.',
'Pet World':'Explore the pet park and walk up to the adorable pets to collect them.',
'Mega City Tycoon':'Build your own 3D city. Buy plots and watch your skyline grow.',
'Sky Islands':'Jump between floating islands high above the clouds and collect gems.',
'Fashion Studio':'Walk around the 3D studio and customize your blocky avatar.',
'Speed Run':'Race through a 3D obstacle course. Avoid lava and reach the finish.',
'Cafe Life':'Explore your own cafe, serve customers and decorate the room.',
'Block Builder':'Place blocks in a 3D building area and make your own creation.'
};
const allowed=Object.keys(descriptions),name=allowed.includes(game)?game:'Tower of Jump';
document.title=name+' 3D';document.getElementById('title').textContent=name;document.getElementById('desc').textContent=descriptions[name];document.getElementById('back').onclick=()=>location.href='index.html';
const stage=document.getElementById('stage'),hint=document.getElementById('hint'),actions=document.getElementById('actions');
const scene=new THREE.Scene();scene.background=new THREE.Color(name==='Sky Islands'?0x8bcdf4:0x91d5f5);scene.fog=new THREE.Fog(scene.background,35,100);
const camera=new THREE.PerspectiveCamera(65,1,.1,180);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff4ff,0x66734c,2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-15,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,rough=.85)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const M={grass:mat(0x61b85b),darkGrass:mat(0x398747),road:mat(0x555d68),sidewalk:mat(0xc7c8bc),wood:mat(0x94613e),brick:mat(0xd69a6a),blue:mat(0x4688d9),red:mat(0xe85b58),yellow:mat(0xf5ce52),white:mat(0xf5f3e9),glass:mat(0x8dd9ef,.35),stone:mat(0x87919b),cloud:mat(0xffffff),pink:mat(0xf29ac4)};
let colliders=[],collectibles=[],pets=[],buildings=[],player,velocity=new THREE.Vector3(),onGround=false,keys={},score=0,coins=150,served=0,lookYaw=0,lookPitch=.25,mouseDown=false,prev={x:0,y:0},clock=new THREE.Clock(),finished=false;
function box(x,y,z,w,h,d,material,solid=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);if(solid)colliders.push({x,z,w,d,top:y+h/2,bottom:y-h/2,mesh:o});return o}
function sphere(x,y,z,r,material){const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function cylinder(x,y,z,r1,r2,h,material){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function ground(size=60,color=0x65b95e){const g=box(0,-.35,0,size,.7,size,mat(color));return g}
function tree(x,z){cylinder(x,1,z,.28,.38,2,M.wood);sphere(x,2.7,z,1.25,mat(0x39a65a));sphere(x-.6,2.5,z+.2,.8,mat(0x4cbb69))}
function house(x,z,color=0xe6aa73){box(x,1.6,z,4,3.2,4,mat(color));const roof= new THREE.Mesh(new THREE.ConeGeometry(3.1,1.8,4),mat(0x9b5550));roof.position.set(x,4.1,z);roof.rotation.y=Math.PI/4;roof.castShadow=true;scene.add(roof);box(x,1,z+2.03,1,2,.12,mat(0x70452f),false);for(let dx of [-1.2,1.2])box(x+dx,2,z+2.08,.75,.8,.12,M.glass,false)}
function avatar(){const g=new THREE.Group();const torso=new THREE.Mesh(new THREE.BoxGeometry(.9,1.1,.48),mat(0x326de0));torso.position.y=1.45;g.add(torso);const head=new THREE.Mesh(new THREE.BoxGeometry(.72,.72,.72),mat(0xf0bd91));head.position.y=2.38;g.add(head);for(let x of [-.2,.2]){const eye=sphere(x,2.42,.37,.045,mat(0x20222a));g.add(eye)}for(let x of [-.58,.58]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.28,.95,.3),mat(0xf0bd91));arm.position.set(x,1.5,0);g.add(arm)}for(let x of [-.24,.24]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.32,.85,.38),mat(0x333b58));leg.position.set(x,.48,0);g.add(leg)}g.position.set(0,0,8);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g);return g}
function star(x,y,z){const o=new THREE.Mesh(new THREE.OctahedronGeometry(.48),mat(0xffd84d));o.position.set(x,y,z);scene.add(o);collectibles.push(o)}
function pet(x,z,color,kind='dog'){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(.95,.72,.65),mat(color));body.position.y=.65;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.62,.62,.62),mat(color));head.position.set(0,1.12,.43);g.add(head);for(let ex of [-.15,.15]){const eye=sphere(ex,1.18,.75,.045,mat(0x171717));g.add(eye)}for(let ex of [-.28,.28]){const ear=new THREE.Mesh(new THREE.BoxGeometry(.18,.42,.2),mat(color));ear.position.set(ex,1.52,.4);g.add(ear)}g.position.set(x,0,z);g.userData={pet:true,collected:false};scene.add(g);pets.push(g);return g}
function makeCity(){ground(65,0x73bd67);box(0,.03,0,12,.08,65,M.road,false);box(-13,.03,0,5,.08,65,M.sidewalk,false);box(13,.03,0,5,.08,65,M.sidewalk,false);for(let i=-25;i<=25;i+=5){box(0,.09,i,.18,.02,2,M.yellow,false)}for(let i=0;i<5;i++){house(-22+i*11,-12,i%2?0xd78b88:0xe6aa73);house(-22+i*11,12,i%2?0x9ca9e7:0xe6d27a)}for(let i=0;i<15;i++)tree(-28+(i%5)*14,-23+Math.floor(i/5)*23);for(let i=0;i<8;i++)star(-24+(i%4)*16,1.6,-5+Math.floor(i/4)*10)}
function makeObby(sky=false,speed=false){ground(70,0x80c96c);for(let i=0;i<8;i++){let x=i*4.5-8,z=-i*5;let y=i*.8+.4;if(sky){box(x,y,z,4,1,4,mat([0xf3b35b,0x8f9df4,0x63cdb5,0xf29ac4][i%4]));}else box(x,y,z,4,1,4,mat(i%2?0x72c66c:0x4fae60));if(speed&&i%2===0){let h=box(x,y+1.2,z,1.1,2,1.1,M.red,false);h.userData.hazard=true}}box(30,1,-39,5,2,5,M.yellow);for(let i=0;i<4;i++)tree(-18-i*3,8+i*4)}
function makePets(){ground(55,0x8ed27a);for(let i=0;i<8;i++)tree(-22+(i%4)*14,-18+Math.floor(i/4)*34);for(let i=0;i<12;i++)pet(-15+(i%4)*10,-13+Math.floor(i/4)*10,[0xf4b6a0,0xf1d36d,0xb7a5ef,0x8ed6d0][i%4],i%2?'cat':'dog');for(let i=0;i<8;i++)star(-18+(i%4)*12,1.2,-15+Math.floor(i/4)*18)}
function makeTycoon(){ground(60,0x6ebc66);for(let i=0;i<6;i++){let x=(i%3-1)*13,z=Math.floor(i/3)*-12-4;box(x,.08,z,10,.15,10,M.sidewalk);const p=box(x,.2,z,8,.18,8,mat(0x9eacb8),false);p.userData.plot=i;buildings.push({x,z,level:0,base:p})} }
function addBuilding(i){const b=buildings[i];if(!b||b.level>=3||coins<50*(b.level+1))return;coins-=50*(b.level+1);b.level++;let h=b.level*3+1;box(b.x,.2+h/2,b.z,4,h,4,mat([0x5d9bd6,0xe5a45f,0x8b91c9][i%3]));for(let y=1;y<h;y+=1.3)for(let x of [-1,1])box(b.x+x,y,b.z+2.03,.65,.65,.1,M.glass,false);updateStats()}
function makeFashion(){ground(30,0xdba6cb);box(0,1,-5,18,2,.4,mat(0x8c6ba8));for(let i=0;i<5;i++)box(-8+i*4,2,-4,.5,4,.5,M.yellow);for(let i=0;i<4;i++)box(-7+i*4,.1,3,2,.2,2,M.white)}
function makeCafe(){ground(28,0xb88764);box(0,3,-8,20,6,.5,mat(0xe6c69c));for(let x of [-8,-4,0,4,8])box(x,3,-7.7,1.4,1.8,.15,M.glass,false);box(0,1.2,-3,8,1,2,mat(0x784b31));for(let x of [-6,0,6]){box(x,.7,2,2.5,.25,2,mat(0x875232));cylinder(x,1.7,2,.55,.55,1.8,mat(0x9a6341));cylinder(x,2.7,2,.8,.8,.15,M.wood)}for(let i=0;i<3;i++)pet(-5+i*5,6,0xd9a47b,'customer')}
function makeBuilder(){ground(45,0x7bbd69);for(let x=-10;x<=10;x+=2)for(let z=-10;z<=10;z+=2){const tile=box(x,.02,z,1.96,.04,1.96,mat(0x9acb7b),false);tile.userData.buildTile=true} }
function buildScene(){if(name==='Brookhaven RP')makeCity();else if(name==='Tower of Jump')makeObby(false,false);else if(name==='Speed Run')makeObby(false,true);else if(name==='Sky Islands'){scene.background=new THREE.Color(0x79c8f3);ground(70,0x93d7f5);for(let i=0;i<9;i++){let x=i*5-20,z=-i*5;let p=box(x,i*1.1,z,5,1.2,5,mat([0x75c86c,0x9b9bea,0x65c7b1][i%3]));if(i%2===0)tree(x,z+1);if(i===8)star(x, i*1.1+2,z)}for(let i=0;i<15;i++)sphere(-25+Math.random()*50,Math.random()*7-2,-30+Math.random()*45,1.5,M.cloud)}else if(name==='Pet World')makePets();else if(name==='Mega City Tycoon')makeTycoon();else if(name==='Fashion Studio')makeFashion();else if(name==='Cafe Life')makeCafe();else makeBuilder();player=avatar()}
function updateStats(){document.getElementById('stats').textContent=name==='Mega City Tycoon'?'🪙 '+Math.floor(coins)+' coins':name==='Pet World'?'🐾 '+score+'/'+pets.length+' pets':name==='Cafe Life'?'☕ Orders served: '+served:'⭐ '+score+' collected'}
function action(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.appendChild(b);return b}
function setupActions(){actions.innerHTML='';if(name==='Mega City Tycoon'){buildings.forEach((b,i)=>action('Buy plot '+(i+1)+' · '+(50*(b.level+1))+' coins',()=>addBuilding(i)))}if(name==='Fashion Studio'){action('Change outfit',()=>{const colors=[0xe94e91,0x3985df,0x4ab98c,0xf1bd43];player.children[0].material=mat(colors[Math.floor(Math.random()*colors.length)])});action('Change hair',()=>{let h=new THREE.Mesh(new THREE.BoxGeometry(.78,.25,.78),mat([0x38251e,0xd9b35e,0x8c5bcb][Math.floor(Math.random()*3)]));h.position.set(0,2.78,0);player.add(h)})}if(name==='Cafe Life'){['☕ Serve coffee','🍰 Serve cake','🥪 Serve sandwich'].forEach((s,i)=>action(s,()=>{served++;coins+=10;updateStats()}))}if(name==='Block Builder'){const choices=[['Grass',0x5caf55],['Wood',0x95623e],['Stone',0x858d99],['Gold',0xe6c04f],['Blue',0x438de0]];choices.forEach(([n,c])=>action(n,()=>{buildMaterial=mat(c);hint.textContent='Selected '+n+'. Click a tile to place a block.'}))}if(name==='Pet World')action('Collect nearby pet (E)',collectPet)}
let buildMaterial=mat(0x5caf55);
function collectPet(){let near=pets.find(p=>!p.userData.collected&&p.position.distanceTo(player.position)<3.5);if(near){near.userData.collected=true;scene.remove(near);score++;updateStats()}else hint.textContent='Walk closer to a pet first!'}
function reset(){while(scene.children.length>0)scene.remove(scene.children[0]);colliders=[];collectibles=[];pets=[];buildings=[];score=0;coins=150;served=0;velocity.set(0,0,0);keys={};finished=false;lookYaw=0;lookPitch=.25;scene.add(new THREE.HemisphereLight(0xdff4ff,0x66734c,2));const l=new THREE.DirectionalLight(0xffffff,2.4);l.position.set(-15,25,12);l.castShadow=true;scene.add(l);buildScene();setupActions();updateStats();player.position.set(0,0,8);hint.textContent='Click the world to capture mouse · WASD move · Space jump · E interact';}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyE'){if(name==='Pet World')collectPet();else if(name==='Brookhaven RP'){let near=collectibles.find(o=>o.position.distanceTo(player.position)<3);if(near){scene.remove(near);collectibles=collectibles.filter(x=>x!==near);score++;updateStats()}}}});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});
renderer.domElement.addEventListener('click',()=>{if(name!=='Block Builder'&&document.pointerLockElement!==renderer.domElement&&matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){lookYaw-=e.movementX*.0025;lookPitch=Math.max(-.15,Math.min(.75,lookPitch+e.movementY*.002))}});
renderer.domElement.addEventListener('pointerdown',e=>{if(name==='Block Builder'){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(scene.children,true);const hit=hits.find(h=>h.object.userData.buildTile||h.object.parent?.userData.buildTile);if(hit){const p=hit.point;const block=box(Math.round(p.x/2)*2,.8,Math.round(p.z/2)*2,1.9,1.6,1.9,buildMaterial,false);block.userData.placed=true}}});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function move(dt){const forward=new THREE.Vector3(-Math.sin(lookYaw),0,-Math.cos(lookYaw)),right=new THREE.Vector3(Math.cos(lookYaw),0,-Math.sin(lookYaw));let dir=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)dir.add(forward);if(keys.KeyS||keys.ArrowDown)dir.sub(forward);if(keys.KeyD||keys.ArrowRight)dir.add(right);if(keys.KeyA||keys.ArrowLeft)dir.sub(right);if(dir.lengthSq())dir.normalize();let speed=keys.ShiftLeft?10:6;player.position.addScaledVector(dir,speed*dt);if((keys.Space||keys.ArrowUp)&&onGround){velocity.y=9;onGround=false}velocity.y-=22*dt;player.position.y+=velocity.y*dt;let floor=0;for(const c of colliders){if(Math.abs(player.position.x-c.x)<c.w/2+.35&&Math.abs(player.position.z-c.z)<c.d/2+.35&&player.position.y<=c.top&&player.position.y>=c.top-.8&&velocity.y<=0)floor=Math.max(floor,c.top)}if(player.position.y<=floor){player.position.y=floor;velocity.y=0;onGround=true}else onGround=false;if(player.position.y< -15){player.position.set(0,0,8);velocity.set(0,0,0)}if(name==='Brookhaven RP'||name==='Pet World'){for(const o of [...collectibles])if(o.position.distanceTo(player.position)<1.7){scene.remove(o);collectibles=collectibles.filter(x=>x!==o);score++;updateStats()}}if(name==='Tower of Jump'||name==='Speed Run'||name==='Sky Islands'){if(player.position.z< -38&&player.position.x>22){hint.textContent='🏆 FINISH! You completed the course. Press Restart to play again.';finished=true}if(name==='Speed Run'){for(const c of colliders){if(c.mesh.material===M.red&&Math.abs(player.position.x-c.x)<1&&Math.abs(player.position.z-c.z)<1){player.position.set(0,0,8);velocity.set(0,0,0);hint.textContent='Hit a hazard! Try that section again.'}}}}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(player){move(dt);player.rotation.y=lookYaw;const target=new THREE.Vector3(player.position.x+Math.sin(lookYaw)*8,player.position.y+4+lookPitch*5,player.position.z+Math.cos(lookYaw)*8);camera.position.lerp(target,.12);camera.lookAt(player.position.x,player.position.y+1.3,player.position.z-1);for(const p of pets)if(!p.userData.collected){p.position.y=.08+Math.sin(performance.now()*.002+p.position.x)*.12;p.rotation.y+=dt*.5}for(const o of collectibles)o.rotation.y+=dt*1.8;if(name==='Mega City Tycoon'){coins+=dt*buildings.filter(b=>b.level>0).reduce((a,b)=>a+b.level*2,0);updateStats()}}renderer.render(scene,camera)}
document.getElementById('restart').onclick=()=>reset();reset();animate();
</script></body></html>
